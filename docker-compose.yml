services:
  # 1. The Database (Already Recovered)
  music-saas-db:
    image: postgres:15
    container_name: music-saas-db
    restart: always
    ports:
      - "5433:5432" 
    volumes:
      - music-saas_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=music
      - POSTGRES_PASSWORD=music123
      - POSTGRES_DB=music_saas

  # 2. The Backend API
  music-saas-api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile # Adjust if your Dockerfile is named differently
    container_name: music-saas-api
    restart: always
    ports:
      - "3001:4000" # Maps Windows 3001 -> Container 4000
    environment:
      - DATABASE_URL=postgresql://music:music123@music-saas-db:5432/music_saas?schema=public
      - PORT=4000
    depends_on:
      - music-saas-db

  # 3. The Frontend (Next.js)
  music-saas-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile # Adjust if your path is different
    container_name: music-saas-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Use the SERVICE NAME for server-side fetches
      - LESSONS_API_BASE_URL=http://music-saas-api:4000/api
      # Use LOCALHOST for client-side (browser) fetches
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api
    depends_on:
      - music-saas-api

volumes:
  music-saas_postgres_data:
    # We leave this as a standard volume now that it has your recovered data.